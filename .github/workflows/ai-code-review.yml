name: AI Code Review (Ollama)

# Runs automatically on every PR open/push. Can also still be triggered
# manually from the Actions tab, or with:
#   gh workflow run ai-code-review.yml -f pr_number=<PR-NUMBER>

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (manual runs only)"
        required: false

jobs:
  review:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.inputs.pr_number }}/head

      - name: Run Ollama review
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/Invoke-OllamaReview.ps1 -PrNumber "${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
